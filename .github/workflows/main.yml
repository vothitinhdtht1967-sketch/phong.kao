name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o AnVaTap-V1-GitHub.zip
          cd AnVaTapV1
                    sed -i '/id("org.jetbrains.kotlin.android") version "2.0.21" apply false/a\    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false' build.gradle.kts
          sed -i '/id("org.jetbrains.kotlin.android")/a\    id("org.jetbrains.kotlin.plugin.compose")' app/build.gradle.kts
          sed -i '67s/\.roundToInt()/\.toInt()/g' app/src/main/java/com/anvatap/app/MainActivity.kt
          sed -i '70s/^/@OptIn(ExperimentalMaterial3Api::class) /' app/src/main/java/com/anvatap/app/MainActivity.kt
          sed -i '73s/,save,/,::save,/' app/src/main/java/com/anvatap/app/MainActivity.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: AnVaTapV1
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnVaTap-debug
          path: AnVaTapV1/app/build/outputs/apk/debug/app-debug.apk
