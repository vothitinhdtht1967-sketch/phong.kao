name: Build Android APK V2

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V2 source
        run: |
          rm -rf AnVaTapV2
          unzip -q AnVaTap-V2-Upgraded.zip

          echo "=== V2 files ==="
          find AnVaTapV2 -maxdepth 3 -type f | head -100

      - name: Fix Kotlin source
        working-directory: AnVaTapV2
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path("app/src/main/java").rglob("MainActivity.kt"))

          if not files:
              raise SystemExit("MainActivity.kt not found")

          p = files[0]
          s = p.read_text()

          # Fix KeyboardOptions import
          s = s.replace(
              "import androidx.compose.ui.text.input.KeyboardOptions",
              "import androidx.compose.foundation.text.KeyboardOptions"
          )

          # Fix Double / Int calculation
          s = s.replace(
              "val cg=((goal-pg*4-fg*9)/4).coerceAtLeast(0.0).roundToInt()",
              "val cg=((goal-pg*4-fg*9)/4.0).coerceAtLeast(0.0).roundToInt()"
          )

          # Opt in to experimental Material 3 APIs
          optin = "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)"

          if optin not in s:
              s = optin + "\n" + s

          p.write_text(s)

          print("Fixed:", p)
          PY

      - name: Fix Compose Compiler Plugin
        working-directory: AnVaTapV2
        run: |
          cat
