name: Build Android APK V2

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V2 source
        run: |
          rm -rf AnVaTapV2
          unzip -q AnVaTap-V2-Upgraded.zip
          echo "Extracted files:"
          find AnVaTapV2 -maxdepth 2 -type f | head -50

      - name: Fix Compose Compiler Plugin
        working-directory: AnVaTapV2
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

      - name: Fix App Compose Plugin
        working-directory: AnVaTapV2/app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build.gradle.kts")
          s = p.read_text()

          old = '''plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }'''

          new = '''plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }'''

          if old in s:
              s = s.replace(old, new)
          elif 'id("org.jetbrains.kotlin.plugin.compose")' not in s:
              s = s.replace(
                  'id("org.jetbrains.kotlin.android")',
                  'id("org.jetbrains.kotlin.android")\n    id("org.jetbrains.kotlin.plugin.compose")'
              )

          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK V2
        working-directory: AnVaTapV2
        run: gradle assembleDebug --stacktrace

      - name: Upload APK V2
        uses: actions/upload-artifact@v4
        with:
          name: AnVaTap-V2-debug
          path: AnVaTapV2/app/build/outputs/apk/debug/app-debug.apk
