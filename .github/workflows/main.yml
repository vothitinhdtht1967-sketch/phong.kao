name: Build Android APK V2

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V2 source
        run: |
          rm -rf AnVaTapV2
          unzip -q AnVaTap-V2-Upgraded.zip

          echo "===== SOURCE STRUCTURE ====="
          find AnVaTapV2 -maxdepth 4 -type f | head -100

      - name: Fix Kotlin source
        working-directory: AnVaTapV2
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path("app/src/main/java").rglob("MainActivity.kt"))

          if not files:
              raise SystemExit("ERROR: MainActivity.kt not found")

          p = files[0]
          s = p.read_text()

          # Fix KeyboardOptions import
          s = s.replace(
              "import androidx.compose.ui.text.input.KeyboardOptions",
              "import androidx.compose.foundation.text.KeyboardOptions"
          )

          # Fix Double / Int calculation
          s = s.replace(
              "val cg=((goal-pg*4-fg*9)/4).coerceAtLeast(0.0).roundToInt()",
              "val cg=((goal-pg*4-fg*9)/4.0).coerceAtLeast(0.0).roundToInt()"
          )

          # Opt in to experimental Material 3 APIs
          optin = "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)"

          if optin not in s:
              s = optin + "\n" + s

          p.write_text(s)

          print("Kotlin source fixed:", p)
          PY

      - name: Configure Compose Compiler
        working-directory: AnVaTapV2
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

      - name: Enable Compose Compiler in app
        working-directory: AnVaTapV2/app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build.gradle.kts")
          s = p.read_text()

          if 'id("org.jetbrains.kotlin.plugin.compose")' not in s:
              s = s.replace(
                  'id("org.jetbrains.kotlin.android")',
                  'id("org.jetbrains.kotlin.android")\n    id("org.jetbrains.kotlin.plugin.compose")'
              )

          p.write_text(s)

          print("Compose Compiler plugin enabled")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: AnVaTapV2
        run: |
          gradle assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "===== SEARCHING FOR APK ====="

          find . -type f -name "*.apk" -print

          APK=$(find AnVaTapV2 -type f -name "app-debug.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p artifact
          cp "$APK" artifact/AnVaTap-V2-debug.apk

          echo "===== ARTIFACT ====="
          ls -lh artifact/

      - name: Upload APK V2
        uses: actions/upload-artifact@v4
        with:
          name: AnVaTap-V2-debug
          path: artifact/AnVaTap-V2-debug.apk
          if-no-files-found: error
