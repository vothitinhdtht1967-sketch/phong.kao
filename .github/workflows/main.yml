name: Build Android APK V2

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android V2
        run: |
          rm -rf AnVaTapV2
          unzip -q AnVaTap-V2-Upgraded.zip

          sed -i '/id("org.jetbrains.kotlin.android") version/a\    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false' AnVaTapV2/build.gradle.kts

          sed -i '/id("org.jetbrains.kotlin.android")/a\    id("org.jetbrains.kotlin.plugin.compose")' AnVaTapV2/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK V2
        working-directory: AnVaTapV2
        run: gradle assembleDebug --stacktrace

      - name: Upload APK V2
        uses: actions/upload-artifact@v4
        with:
          name: AnVaTap-V2-debug
          path: AnVaTapV2/app/build/outputs/apk/debug/app-debug.apk
